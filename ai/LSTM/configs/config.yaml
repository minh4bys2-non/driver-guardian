# ==============================================================================
# DRIVER GUARDIAN - CONFIGURATION FILE
# Cấu hình huấn luyện mô hình SpatioTemporal ConvGRU & End-to-End DrowsyClassifier
# ==============================================================================

# ---- 1. DATASET CONFIGURATION (RAW VIDEO) ----
dataset:
  # [DÙNG CHUNG] Thư mục gốc chứa video thô (đã quét nhãn hoặc có cấu trúc train/val)
  dataset_dir: "E:/LSTM/UL-DD_Processed"
  # [DÙNG CHUNG] Tệp manifest CSV chứa danh sách video clip, nhãn và trường phân chia split
  manifest_file: "dataset_merged_split.csv"
  # [DÀNH RIÊNG train.py] Trọng số PyTorch .pt tối ưu của mô hình BackboneNeck NMSFreeDetector
  backbone_neck_checkpoint: "D:/Project/DATN/driver-guardian/ai/ObjectDetection_2p6M/checkpoints/231e35bb4061257f9bcb7cc5e3a0d0064e5e1beb6351a5e0adfc8d0c91ba4e11/da92589d1b67339be4491beaf147575e81a2699bbde06d654c05f852d7f0e9c9/landmark_train/best.pt"
  # [DÙNG CHUNG] Khoảng thời gian (giây) giữa các khung hình lấy mẫu (FPS hiệu dụng = 5.0)
  sample_interval: 0.2
  # [DÙNG CHUNG] Số lượng khung hình cố định (null = dynamic padding theo độ dài clip)
  seq_len: null
  # [DÙNG CHUNG] Kích thước khung hình (Height, Width) đưa vào Backbone
  image_size: [224, 224]
  # [DÙNG CHUNG] Các định dạng video hợp lệ được hỗ trợ
  video_exts: [".avi", ".mp4", ".mkv", ".mov"]
  # [DÙNG CHUNG] Số khung hình tối thiểu để coi là một video hợp lệ
  min_frames: 10
  # [DÙNG CHUNG] Bật/tắt tăng cường dữ liệu thời gian cho tập huấn luyện
  use_augmentation: true

# ---- 2. DATALOADER CONFIGURATION ----
dataloader:
  # [DÙNG CHUNG] Kích thước batch size cho tập train và val
  batch_size: 2
  val_batch_size: 2
  # [DÙNG CHUNG] Số tiến trình worker tải dữ liệu (0: an toàn nhất trên Windows tránh deadlock)
  num_workers: 0
  val_num_workers: 0
  # [DÙNG CHUNG] Khóa vùng nhớ GPU (False để tránh tràn pinned memory khi xử lý video lớn)
  pin_memory: false
  # [DÙNG CHUNG] Trộn ngẫu nhiên tập huấn luyện
  shuffle: true
  # [DÙNG CHUNG] Hạt giống ngẫu nhiên để tái lập kết quả
  seed: 42
  # [DÀNH RIÊNG train.py] Kích thước mini-chunk chia nhỏ khung hình khi forward qua Backbone tránh tràn VRAM
  chunk_size: 32

# ---- 3. MODEL ARCHITECTURE CONFIGURATION ----
model:
  # === CÁC THAM SỐ DÙNG CHUNG (Cả ConvGRUClassifier và DrowsyClassifier) ===
  # [DÙNG CHUNG] Số lượng lớp phân loại đầu ra (2: Tỉnh táo / Buồn ngủ)
  num_classes: 2
  # [DÙNG CHUNG] Số kênh đặc trưng sau cổ giảm kênh SpatialReductionNeck (nén 448 -> 128)
  input_dim: 128
  # [DÙNG CHUNG] Số kênh ẩn của từng tầng ConvGRU
  hidden_dim: 128
  convgru_hidden_dim: 128
  # [DÙNG CHUNG] Số tầng ConvGRU xếp chồng
  num_layers: 2
  # [DÙNG CHUNG] Tỷ lệ Dropout cho đầu phân loại FC Head
  dropout: 0.35
  # [DÙNG CHUNG] Cơ chế giám sát chuỗi thời gian ('attention_pooling' | 'sequence')
  supervision_mode: "attention_pooling"
  # [DÙNG CHUNG] Kích thước lưới không gian hội tụ (Height, Width) sau SpatialReductionNeck
  target_size: [14, 14]

  # === THAM SỐ DÀNH RIÊNG CHO DROWSYCLASSIFIER (src/models1.py & src/train1.py) ===
  # [DÀNH RIÊNG DrowsyClassifier] Độ rộng kênh các tầng Backbone (c1, c2, c3, c4, c5)
  backbone_w: [16, 32, 64, 128, 256]
  # [DÀNH RIÊNG DrowsyClassifier] Số lượng khối lặp lại trong từng tầng Backbone
  backbone_n: [1, 2, 2, 1]
  # [DÀNH RIÊNG DrowsyClassifier] Số lượng khối lặp lại trong PAFPN
  neck_n: 1
  # [DÀNH RIÊNG DrowsyClassifier/train1.py] Bật gradient checkpointing cho Backbone/Neck tiết kiệm VRAM
  gradient_checkpointing: true
  # [DÀNH RIÊNG DrowsyClassifier/train1.py] Khóa running mean/var của BatchNorm trong Backbone/Neck
  freeze_bn: false

  # === THAM SỐ DÀNH RIÊNG CHO CONVGRU TÁCH RỜI (src/models.py & src/train.py) ===
  # [DÀNH RIÊNG ConvGRUClassifier] Kênh đặc trưng của các tầng (p3, p4, p5) từ NMSFreeDetector PAFPN
  cnn_neck_channels: [64, 128, 256]
  # [DÀNH RIÊNG ConvGRUClassifier] Tỷ lệ Dropout sau cổ giảm kênh SpatialReductionNeck
  adapter_dropout: 0.25

# ---- 4. LOSS CONFIGURATION ----
loss:
  # [DÙNG CHUNG] Loại hàm mất mát: "ce" (CrossEntropyLoss) hoặc "bce" (BCEWithLogitsLoss)
  loss_type: "ce"
  # [DÙNG CHUNG] Hằng số epsilon kẹp giá trị số học khi dùng BCE
  bce_eps: 1.0e-7
  # [DÙNG CHUNG] Cách gom nhóm loss ('mean' | 'sum')
  bce_reduction: "mean"
  # [DÙNG CHUNG] Trọng số cho lớp dương (1: Buồn ngủ) khi dữ liệu mất cân bằng
  pos_weight: null

# ---- 5. OPTIMIZER & SCHEDULER CONFIGURATION ----
optimizer:
  # [DÙNG CHUNG] Tổng số epoch huấn luyện
  epochs: 20
  # [DÙNG CHUNG] Learning rate khởi tạo
  lr0: 0.001
  # [DÙNG CHUNG] Tỷ lệ lr tối thiểu: lr_min = lr0 * lr_min_factor (1e-5)
  lr_min_factor: 0.01
  # [DÙNG CHUNG] Hệ số phạt L2 Regularization (Weight Decay)
  weight_decay: 0.0001
  # [DÙNG CHUNG] Bộ tối ưu hóa: "adamw" | "adam" | "sgd"
  optimizer: "adamw"
  # [DÙNG CHUNG] Tham số betas cho Adam/AdamW
  betas: [0.9, 0.999]
  # [DÙNG CHUNG] Động lượng Momentum khi optimizer="sgd"
  momentum: 0.9
  # [DÙNG CHUNG] Ngưỡng cắt gradient (Gradient Clipping)
  grad_clip_norm: 1.0
  # [DÙNG CHUNG] Số bước tích lũy gradient trước khi cập nhật trọng số
  gradient_accumulation_steps: 4
  # [DÙNG CHUNG] Khoảng cách epoch giữa các lần dọn rác GPU bộ nhớ đệm
  empty_cache_interval: 2
  # [DÙNG CHUNG] Bật/tắt bộ điều chỉnh Learning Rate Scheduler (CosineAnnealingLR)
  use_scheduler: true

# ---- 6. CHECKPOINTS, EARLY STOPPING & LOGGING CONFIGURATION ----
logging:
  # [DÙNG CHUNG] Thư mục lưu log TensorBoard
  tb_log_dir: "logs/tensorboard"
  # [DÙNG CHUNG] Tên bài thử nghiệm huấn luyện
  experiment_name: "deepgru_raw_nmsfree"
  # [DÙNG CHUNG] Thư mục lưu checkpoint mô hình (.pt)
  checkpoint_dir: "checkpoints/experiments"
  # [DÙNG CHUNG] Lưu checkpoint cho tất cả các epoch
  save_all_epochs: true
  # [DÙNG CHUNG] Khoảng epoch giữa 2 lần lưu định kỳ
  save_ckpt_interval_epochs: 1
  # [DÙNG CHUNG] Số lượng checkpoint định kỳ tối đa giữ lại (null = giữ toàn bộ)
  ckpt_keep_last: null
  # [DÙNG CHUNG] Bật/tắt tiếp tục huấn luyện từ checkpoint
  enable_resume: true
  # [DÙNG CHUNG] Đường dẫn file checkpoint hoặc bí danh ('last', 'best') để resume
  resume: "D:/Project/DATN/driver-guardian/ai/LSTM/checkpoints/experiments/deepgru_raw_nmsfree/epoch_6.pt"

  # [DÙNG CHUNG] Cấu hình Giám sát Phân giải cao theo từng Step (Per-Step Metrics)
  enable_step_logging: true
  log_step_interval: 1

  # [DÙNG CHUNG] Cơ chế Dừng sớm (Early Stopping)
  early_stopping: true
  patience: 10
  monitor_metric: "val_f1"
  monitor_mode: "max"
  min_delta: 0.0001

  # [DÙNG CHUNG] File lưu bảng lịch sử các epoch huấn luyện
  history_csv_path: "logs/training_history.csv"

# ---- 7. RUNTIME & HARDWARE CONFIGURATION ----
runtime:
  # [DÙNG CHUNG] Thiết bị tính toán ("cuda" | "cpu")
  device: "cuda"
  # [DÙNG CHUNG] Bật Tự động ép kiểu hỗn hợp FP16 (Automatic Mixed Precision)
  amp: true
  # [DÙNG CHUNG] Số epoch giữa 2 lần đánh giá tập Validation
  val_interval_epochs: 1
  # [DÙNG CHUNG] Bật thanh tiến trình giám sát trực quan tqdm
  use_tqdm: true
