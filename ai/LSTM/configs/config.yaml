# ==============================================================================
# DRIVER GUARDIAN - DEEP GRU CONFIGURATION FILE
# Huấn luyện mô hình trực tiếp từ video thô qua NMSFreeDetector BackboneNeck
# ==============================================================================

# ---- 1. DATASET CONFIGURATION (RAW VIDEO & NMSFreeDetector) ----
dataset:
  # Thư mục gốc chứa video thô (đã quét nhãn hoặc chia train/val)
  dataset_dir: "/home/riftuser/.cache/kagglehub/datasets/nyvantran6634/dataset-datn4ni/versions/1/data_processed"
  # Tệp manifest CSV/JSON (None hoặc rỗng để tự tìm dataset_merged_split.csv)
  manifest_file: "dataset_merged_split.csv"
  # Thư mục tập kiểm định (null: dùng chung dataset_dir/val hoặc tự chia)
  val_dataset_dir: null
  # Tệp manifest cho tập kiểm định (null: tự động theo trường split trong manifest)
  val_manifest: null
  # Trọng số tối ưu PyTorch .pt của mô hình NMSFreeDetector
  backbone_neck_checkpoint: "/home/riftuser/workspace/driver-guardian/ai/ObjectDetection_2p6M/checkpoints/2bfb6cc36ef5ab822a944006c746e5d348d67e387501c9027df5b957cf124031/de0c5b23e1ae749b972f10cb5f3e21e2ccf37bd334eb7a7c3091c460073ff310/finetune/best.pt"
  # Tham số khung hình
  sample_interval: 0.2
  seq_len: Null 
  image_size: [640, 640]
  video_exts: [".avi", ".mp4", ".mkv", ".mov"]
  train_ratio: 0.8
  split_by_subject: true
  min_frames: 10
  use_augmentation: true

# ---- 2. DATALOADER CONFIGURATION ----
dataloader:
  batch_size: 16
  val_batch_size: 8
  num_workers: 0
  val_num_workers: 2
  pin_memory: false
  shuffle: true
  drop_last: false
  persistent_workers: false
  prefetch_factor: null
  seed: 42
  chunk_size: 32

# ---- 3. MODEL ARCHITECTURE CONFIGURATION (NMSFreeDetector PAFPN + Deep GRU) ----
model:
  cnn_neck_channels: [64, 128, 256]
  cnn_strides: [8, 16, 32]
  cnn_num_features: 3
  cnn_out_channels: 448
  cnn_spatial_size: [20, 20]
  spatial_fusion: "concat"
  adapter_dropout: 0.25
  use_norm: true
  input_dim: 256
  hidden_dim: 192
  num_layers: 2
  num_classes: 2
  dropout: 0.35
  supervision_mode: "attention_pooling"

# ---- 4. LOSS CONFIGURATION ----
loss:
  loss_type: "ce"
  bce_eps: 1.0e-7
  bce_reduction: "mean"
  pos_weight: null

# ---- 5. OPTIMIZER & SCHEDULER CONFIGURATION ----
optimizer:
  epochs: 40
  lr0: 0.001
  lr_min_factor: 0.01
  weight_decay: 0.0001
  warmup_epochs: 1.0
  optimizer: "adamw"
  betas: [0.9, 0.999]
  momentum: 0.9
  grad_clip_norm: 1.0
  use_scheduler: true
  scheduler_type: "cosine"

# ---- 6. CHECKPOINTS, EARLY STOPPING & DIAGNOSTICS CONFIGURATION ----
logging:
  tb_log_dir: "logs/tensorboard"
  log_dir: "logs"
  experiment_name: "deepgru_raw_nmsfree"
  checkpoint_dir: "checkpoints/experiments"
  save_all_epochs: true
  save_ckpt_interval_epochs: 1
  save_best_only: false
  ckpt_keep_last: null
  enable_resume: false
  resume_epoch: null
  resume: ""

  # Early Stopping
  early_stopping: true
  patience: 10
  monitor_metric: "val_f1"
  monitor_mode: "max"
  min_delta: 0.0001

  # File kết quả và biểu đồ chẩn đoán
  history_csv_path: "logs/training_history.csv"
  summary_json_path: "logs/training_summary.json"
  plot_curves_path: "logs/loss_accuracy_curves.png"
  plot_cm_path: "logs/confusion_matrix_best.png"
  plot_roc_path: "logs/roc_pr_curves.png"
  dry_run: false

# ---- 7. RUNTIME & HARDWARE CONFIGURATION ----
runtime:
  device: "cuda"
  amp: true
  log_interval: 10
  val_interval_epochs: 1
  use_tqdm: true
